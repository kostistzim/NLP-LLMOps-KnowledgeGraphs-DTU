[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-compass"
version = "1.0.0"
description = "Intelligent Course Planning System for DTU Students"
authors = [
    {name = "Kostis", email = "s242796@dtu.dk"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "langchain==0.3.17",
    "langchain-openai==0.2.14",
    "langchain-community==0.3.16",
    "dspy==2.5.44",
    "sentence-transformers==3.3.1",
    "scikit-learn==1.6.0",
    "faiss-cpu==1.9.0",
    "networkx==3.4.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "python-dotenv==1.0.1",
    "httpx==0.27.2"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.7.4"
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v --cov=. --cov-report=html"